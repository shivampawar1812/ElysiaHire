<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ElysiaHire </title>
    <link rel="stylesheet" href="/01_css/style_02.css">
</head>

<body>
    <header>
        <div class="hero-logo">
            <a href="../index.html"><img src="../00_images/ElysiaHire.png" alt=""></a>
        </div>
    </header>
    <main class="hero">
        <!-- Right Section -->

        <div class="hero-content">
            <h1>Welcome Back</h1>
            <p>Login to continue your career journey</p>
        </div>
        <div>
            <form action="login.html" method="post">

                <label for="email">Email ID:</label>
                <input type="email" id="email" placeholder="Enter your Email">

                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your Password">

                <div class="options">
                    <label> <input type="checkbox">
                        Remember Me
                    </label>
                    <br>
                    <a href="#">Forgot Password?</a>
                </div>
            </form>
            <div class="hero-buttons">
                <button><a href="../index.html">Login</a></button>
            </div>
        </div>
        <div class="or-divider">
            <span>OR</span>
        </div>
        <div class="social-buttons">

            <button>
                <a href="">Login with Google</a>
            </button>

            <button>
                <a href="">Login with LinkedIn</a>
            </button>

        </div>

        <div class="signup-link">
            <span>Don't have an account?</span>
            <a href="signup.html">Sign Up</a>
        </div>
    </main>
    <footer><!-- Copyright -->
        <div class="footer-bottom">
            <p>© 2026 ElysiaHire. All rights reserved.</p>
        </div>
    </footer>


</body>

</html>
