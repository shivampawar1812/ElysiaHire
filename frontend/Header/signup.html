<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ElysiaHire</title>
    <link rel="stylesheet" href="../css/style_03.css">
</head>

<body>
    <header>
        <div class="hero-logo">
            <a href="../index.html"><img src="../images/ElysiaHire.png" alt=""></a>
        </div>
    </header>
    <main class="hero">
        <div class="hero-content">
            <h1>Welcome to ElysiaHire</h1>
            <p>Create account to start your career journey</p>
        </div>
        <div>
            <form action="signup.html" method="post">


                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Enter your Full Name">


                <label for="email">Email ID:</label>
                <input type="email" id="email" placeholder="Enter your Email">

                <label for="phone">Mobile Number:</label>
                <input type="tel" id="phone" placeholder="Enter your Mobile Number">

                <label for="passwprd">Password:</label>
                <input type="password" id="password" placeholder="Enter Password">

                <label for="confirm password">Confirm Password:</label>
                <input type="password" id="confirm password" placeholder="Confirm Password">
            </form>
            <div class="hero-buttons">
                <button><a href="../index.html">Sign Up</a></button>
            </div>
             <div class="or-divider">
            <span>OR</span>
        </div>
        <div class="social-buttons">

            <button>
                <a href="">Sign Up with Google</a>
            </button>

            <button>
                <a href="">Sign Up with LinkedIn</a>
            </button>
        </div>
        <div class="login-link">
            <span>Already have an account?</span>
            <a href="login.html">Login</a>
        </div>
    </main>
    <footer><!-- Copyright -->
        <div class="footer-bottom">
            <p>© 2026 ElysiaHire. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
